name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build app
        run: pyinstaller --noconfirm --windowed --name MeiMei mei_mei.py
      - name: Add images and audio
        shell: cmd
        run: |
          xcopy /E /I /Y images dist\MeiMei\images
          copy /Y music.mp3 dist\MeiMei\
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: MeiMei-Setup
          path: installer/MeiMei-Setup.exe
